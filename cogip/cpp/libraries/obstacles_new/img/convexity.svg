<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 230 155" xmlns="http://www.w3.org/2000/svg">
  <!-- The check reads the turn at each vertex. Four of them agree; the notch
       turns the other way, which is what makes the outline concave. -->
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="11" fill="#334455">
    <polygon points="35,30 175,30 175,120 105,72 35,120" fill="none"
             stroke="#334455" stroke-width="1.5"/>

    <g fill="#2a8855" font-size="15">
      <text x="24" y="27">&#8635;</text>
      <text x="176" y="27">&#8635;</text>
      <text x="176" y="135">&#8635;</text>
      <text x="24" y="135">&#8635;</text>
    </g>
    <text x="98" y="66" fill="#cc3333" font-size="15">&#8634;</text>
    <circle cx="105" cy="72" r="4" fill="#cc3333"/>

    <text x="115" y="150" font-size="11">one vertex turns the other way</text>
  </g>
</svg>
