<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 330 130" xmlns="http://www.w3.org/2000/svg">
  <!-- Stroking a path with width 2r and a round line join is the Minkowski sum
       of that path with a disc of radius r. This figure is drawn by the very
       identity it illustrates. -->
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="11" fill="#334455">
    <rect x="30" y="45" width="70" height="40" fill="none"
          stroke="#334455" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="65" y="112" text-anchor="middle">P</text>

    <text x="120" y="72" font-size="17">&#8853;</text>

    <circle cx="168" cy="65" r="18" fill="#cfd8e8"/>
    <line x1="168" y1="65" x2="186" y2="65" stroke="#334455" stroke-width="1"/>
    <text x="174" y="61">r</text>
    <text x="168" y="112" text-anchor="middle">D(r)</text>

    <text x="208" y="72" font-size="17">=</text>

    <rect x="255" y="50" width="40" height="30" fill="#cfd8e8"
          stroke="#cfd8e8" stroke-width="36" stroke-linejoin="round"/>
    <rect x="255" y="50" width="40" height="30" fill="none"
          stroke="#334455" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="275" y="112" text-anchor="middle">S</text>
  </g>
</svg>
