<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 330 145" xmlns="http://www.w3.org/2000/svg">
  <!-- A disc is unchanged by rotation, so turning the grown shape and turning
       the outline before growing it give the same set. Only P carries an angle. -->
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="11" fill="#334455">
    <rect x="45" y="52" width="60" height="35" fill="#cfd8e8"
          stroke="#cfd8e8" stroke-width="32" stroke-linejoin="round"/>
    <rect x="45" y="52" width="60" height="35" fill="none"
          stroke="#334455" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="75" y="132" text-anchor="middle">P &#8853; D(r)</text>

    <text x="152" y="75" font-size="15">&#8594;</text>
    <text x="160" y="62">R</text>

    <g transform="rotate(30 250 69)">
      <rect x="220" y="52" width="60" height="35" fill="#cfd8e8"
            stroke="#cfd8e8" stroke-width="32" stroke-linejoin="round"/>
      <rect x="220" y="52" width="60" height="35" fill="none"
            stroke="#334455" stroke-width="1.5" stroke-dasharray="5 4"/>
    </g>
    <text x="250" y="132" text-anchor="middle">R(P) &#8853; D(r)</text>
  </g>
</svg>
