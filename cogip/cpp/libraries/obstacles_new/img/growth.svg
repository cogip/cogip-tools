<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 250 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Growing twice and growing once by the sum are the same set, so the two
       regions below are concentric offsets of one outline, never of each other. -->
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="11" fill="#334455">
    <rect x="90" y="55" width="60" height="40" fill="#e9eef6"
          stroke="#e9eef6" stroke-width="60" stroke-linejoin="round"/>
    <rect x="90" y="55" width="60" height="40" fill="#cfd8e8"
          stroke="#cfd8e8" stroke-width="32" stroke-linejoin="round"/>
    <rect x="90" y="55" width="60" height="40" fill="none"
          stroke="#334455" stroke-width="1.5" stroke-dasharray="5 4"/>

    <line x1="150" y1="75" x2="166" y2="75" stroke="#334455" stroke-width="1"/>
    <line x1="166" y1="75" x2="180" y2="75" stroke="#334455" stroke-width="1"
          stroke-dasharray="2 2"/>
    <text x="155" y="70">r</text>
    <text x="167" y="70">&#961;</text>

    <text x="120" y="140" text-anchor="middle">P &#8853; D(r) &#8853; D(&#961;) = P &#8853; D(r + &#961;)</text>
  </g>
</svg>
