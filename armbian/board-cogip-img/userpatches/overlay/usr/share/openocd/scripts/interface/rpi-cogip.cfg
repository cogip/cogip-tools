# COGIP SWD via the Raspberry Pi bitbang GPIO driver (bcm2835gpio).
# NOTE: this driver mmaps /dev/mem; on Armbian's restricted kernel it fails at
# init with "mmap: Operation not permitted". The fix is NOT linuxgpiod (Debian's
# openocd 0.12 is not built with it) but adding `iomem=relaxed` to the kernel
# cmdline so /dev/mem mmap is allowed. TODO: wire iomem=relaxed into cmdline.txt.
# Pins (BCM): SWCLK=GPIO23, SWDIO=GPIO24, SRST=GPIO25.
source [find interface/raspberrypi-native.cfg]

bindto 0.0.0.0

transport select swd

source [find target/stm32g4x.cfg]
bcm2835gpio_swd_nums 23 24
bcm2835gpio_srst_num 25

reset_config srst_only
reset_config srst_nogate
reset_config srst_open_drain
reset_config connect_assert_srst

adapter_nsrst_delay 100
adapter_nsrst_assert_width 100

init
targets
reset run
